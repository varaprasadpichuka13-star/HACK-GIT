<div class="scrim" id="scrim"></div>

<script>
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const ic={Overview:'<rect x="3" y="3" width="7" height="9" rx="1.5"/><rect x="14" y="3" width="7" height="5" rx="1.5"/><rect x="14" y="12" width="7" height="9" rx="1.5"/><rect x="3" y="16" width="7" height="5" rx="1.5"/>',Students:'<circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c0-3.5 3-6 6.5-6s6.5 2.5 6.5 6M16 4.5a3.5 3.5 0 0 1 0 7M18 14c2.2.6 3.5 2.6 3.5 5"/>',Invoices:'<path d="M14 3H6a1.5 1.5 0 0 0-1.5 1.5v15A1.5 1.5 0 0 0 6 21h12a1.5 1.5 0 0 0 1.5-1.5V8.5zM14 3v5.5h5.5M8 13h8M8 17h5"/>',Receivables:'<path d="M3 7.5A2.5 2.5 0 0 1 5.5 5H19v14H5.5A2.5 2.5 0 0 1 3 16.5zM16 12h2"/>',Cashflow:'<path d="M3 17l6-6 4 4 8-8M15 7h6v6"/>',Simulator:'<path d="M4 6h10M18 6h2M4 12h2M10 12h10M4 18h12M20 18h0"/><circle cx="16" cy="6" r="2"/><circle cx="8" cy="12" r="2"/><circle cx="18" cy="18" r="2"/>'};
const TRASH='<svg class="i" viewBox="0 0 24 24"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/></svg>';
const CK='<svg class="i" viewBox="0 0 24 24"><path d="m5 12.5 4.5 4.5L19 7.5"/></svg>';
$('#nav').innerHTML=Object.keys(ic).map((k,i)=>`<button class="nv${i?'':' on'}" data-n="${k}"><svg class="i" viewBox="0 0 24 24">${ic[k]}</svg>${k}</button>`).join('');
const toast=t=>{const e=$('#toast');e.textContent=t;e.classList.add('on');clearTimeout(toast.h);toast.h=setTimeout(()=>e.classList.remove('on'),2200)};
const closeSide=()=>{$('#side').classList.remove('on');$('#scrim').classList.remove('on')};
$('#menu').onclick=()=>{$('#side').classList.add('on');$('#scrim').classList.add('on')};$('#scrim').onclick=closeSide;

/* ===== date: "today" is the real date in India, not a fixed constant ===== */
const T0=new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Kolkata',year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date());
const nowIST=new Date().toLocaleDateString('en-US',{weekday:'long',month:'long',day:'numeric',timeZone:'Asia/Kolkata'});
$('#date').textContent=nowIST;
const hr=new Date().getHours(),TOD=hr<12?'Good morning':hr<18?'Good afternoon':'Good evening';

/* ===== helpers ===== */
const sum=(a,f)=>a.reduce((x,y)=>x+f(y),0);
const Dt=s=>new Date(s+'T00:00:00Z'),iso=d=>d.toISOString().slice(0,10);
const dd=(a,b)=>Math.round((Dt(a)-Dt(b))/864e5);
const add=(s,n)=>iso(new Date(Dt(s).getTime()+n*864e5));
/* adds months and keeps the day, clamped to the month's length (31 Jan + 1 = 28/29 Feb) */
const addM=(s,k)=>{const d=Dt(s),day=d.getUTCDate();d.setUTCDate(1);d.setUTCMonth(d.getUTCMonth()+k);const last=new Date(Date.UTC(d.getUTCFullYear(),d.getUTCMonth()+1,0)).getUTCDate();d.setUTCDate(Math.min(day,last));return iso(d)};

    const sid=String(x.sid??'');if(!ids.has(sid)){ids.add(sid);sts.push({id:sid,name:'Unknown student (recovered)',parent:'—',phone:'',fee:0,joined:T0,notes:'Recovered from an invoice with no matching student.',archived:true})}

    const pays=(Array.isArray(x.pays)?x.pays:[]).filter(obj).map(q=>({a:num(q.a),d:isD(q.d)?q.d:iss,m:String(q.m||'UPI'),n:String(q.n||'')})).filter(q=>q.a>0);
    inv.push({id,no:x.no?String(x.no):'FF-'+T0.slice(0,4)+'-'+String(900+k),sid,per:String(x.per||monLbl(iss)),iss,due:isD(x.due)?x.due:add(iss,10),amt:num(x.amt),pays,draft:!!x.draft,notes:String(x.notes||'')})});
  const seen=new Set();inv.forEach(i=>{while(seen.has(i.no))i.no+='-b';seen.add(i.no)});
  const exp=(Array.isArray(p.expenses)?p.expenses:[]).filter(obj).map((e,k)=>({id:String(e.id??('e'+k+newSid())),name:String(e.name||'Expense'),amt:num(e.amt),due:isD(e.due)?e.due:T0,fr:e.fr==='One-time'?'One-time':'Monthly',cat:String(e.cat||'Other'),paid:Array.isArray(e.paid)?e.paid.filter(isM):[]}));

}

const active=()=>S.students.filter(s=>!s.archived);

const invs=sid=>S.invoices.filter(i=>i.sid==sid).sort((a,b)=>b.due.localeCompare(a.due));
const bal=i=>i.amt-sum(i.pays,p=>p.a);
const paidA=i=>i.amt-bal(i);
const stt=i=>i.draft?'Draft':bal(i)<=0?'Paid':dd(i.due,T0)<0?'Overdue':paidA(i)>0?'Partially paid':'Pending';
/* open invoices that still count as money owed: issued, unpaid, and belonging to a current (not archived) student */
const out=()=>S.invoices.filter(i=>!i.draft&&bal(i)>0&&!!stu(i.sid)&&!stu(i.sid).archived);
const owed=sid=>sum(invs(sid).filter(i=>!i.draft),bal);
/* a student's status looks at every invoice, not only the latest one */
const sst=s=>{const L=invs(s.id).filter(i=>!i.draft);if(!L.length)return '—';const open=L.filter(i=>bal(i)>0);if(!open.length)return 'Paid';
  if(open.some(i=>stt(i)==='Overdue'))return 'Overdue';if(open.some(i=>paidA(i)>0))return 'Partially paid';return open.some(i=>dd(i.due,T0)<=7)?'Due soon':'Pending'};
const lastPay=id=>{const p=invs(id).flatMap(i=>i.pays.map(x=>x.d)).sort().pop();return p?fd(p):'—'};
const nextDue=id=>{const o=invs(id).filter(i=>!i.draft&&bal(i)>0).map(i=>i.due).sort()[0];if(o)return fd(o);const l=invs(id)[0];return l?fd(addM(l.due,1)):'—'};
const days=i=>-dd(i.due,T0);
const rcv=()=>out().sort((a,b)=>(days(b)>0)-(days(a)>0)||days(b)-days(a)||bal(b)-bal(a));
const nov=()=>S.invoices.filter(i=>i.per===monLbl(T0)&&!i.draft);
const invNum=i=>+((String(i.no).match(/(\d+)$/)||[])[1]||0);
const nextNo=()=>{const pre='FF-'+T0.slice(0,4)+'-';let n=Math.max(0,...S.invoices.map(invNum))+1;while(S.invoices.some(i=>i.no===pre+String(n).padStart(3,'0')))n++;return pre+String(n).padStart(3,'0')};
/* cash on hand: opening balance + every payment received − every bill marked paid */
const cashToday=()=>S.settings.opening+sum(S.invoices,i=>sum(i.pays,p=>p.a))-sum(S.expenses,e=>e.paid.length*e.amt);
/* every bill occurrence from (today − back days) to (today + N days); g = days from today, paid = marked paid */
function billList(N,back){
  const res=[],lim=add(T0,N),start=add(T0,-back);
  S.expenses.forEach(e=>{
    let dt=e.due,guard=0;
    if(e.fr==='Monthly'){while(dd(dt,start)<0&&guard++<1200)dt=addM(dt,1)}
    else if(dd(dt,start)<0)return;
    guard=0;
    while(dd(dt,lim)<=0&&guard++<60){const key=dt.slice(0,7);res.push({e,dt,g:dd(dt,T0),key,paid:e.paid.includes(key)});if(e.fr!=='Monthly')break;dt=addM(dt,1)}
  });
  return res;
}
/* bills for the to-do list: overdue unpaid ones plus anything due in the next 7 days */
const bills=()=>billList(7,60).filter(b=>b.g<=7&&(b.g>=0||!b.paid)).sort((x,y)=>x.g-y.g);
/* forecast: invoices still owed, tuition not yet invoiced (joined students only), recurring bills */
function fc(N,m){m=m||{};const ev=[];
  out().forEach(i=>{let d=Math.max(dd(i.due,T0),2),a=bal(i);if(m.id==i.id){d+=m.dl;a=a*m.pc/100}if(d<=N)ev.push({d,a,n:stu(i.sid).name,k:'in',t:stt(i),id:i.id,x:'inv'})});
  const act=active(),base=T0.slice(0,7)+'-10';
  for(let k=1;k<=4;k++){const dt=addM(base,k),lbl=monLbl(dt),dN=dd(dt,T0);
    const fees=sum(act.filter(s=>s.joined<=dt&&!S.invoices.some(i=>i.sid===s.id&&i.per===lbl)),s=>s.fee);
    if(dN<=N&&fees>0)ev.push({d:dN,a:fees,n:monName(dt)+' tuition (not yet invoiced)',k:'in',t:'Not invoiced',x:''})}
  billList(N,60).filter(b=>!b.paid).forEach(b=>{const d=Math.max(b.g,0);if(d<=N)ev.push({d,a:b.e.amt+(m.eid==b.e.id?+m.ea:0),n:b.e.name,k:'out',t:b.e.fr,id:b.e.id,x:'exp'})});
  ev.sort((x,y)=>x.d-y.d);
  const bl=[];let c=cashToday();
  for(let d=0;d<=N;d++){ev.filter(e=>e.d===d).forEach(e=>c+=e.k==='in'?e.a:-e.a);bl.push(c)}
  return{ev,bal:bl,N};
}

/* students */
function readStudent(){const g=i=>$('#'+i).value.trim(),er=m=>{$('#er').textContent=m;return null};
  if(!g('a1'))return er('Please enter the student’s name.');
  if(!g('a2'))return er('Please enter a parent or guardian name.');
  if(g('a3')&&!/^[0-9 +-]{7,15}$/.test(g('a3')))return er('Enter a valid phone number, or leave it blank.');
  const f=+g('a4');if(!(f>0))return er('Enter a monthly fee above zero.');
  if(!g('a5'))return er('Pick a joining date.');
  return{name:g('a1'),parent:g('a2'),phone:g('a3'),fee:f,joined:g('a5'),notes:g('a6')}}
const studentFields=(s)=>fld('Student name','a1','text',s?s.name:'','maxlength="60"')+fld('Parent / guardian','a2','text',s?s.parent:'')+`<div class="f2">${fld('Phone (optional)','a3','tel',s?s.phone:'')}${fld('Monthly fee (₹)','a4','number',s?s.fee:'','min="1"')}</div>`+fld('Joining date','a5','date',s?s.joined:T0)+`<label class="f">Notes (optional)<textarea class="in" id="a6">${esc(s?s.notes:'')}</textarea></label><div class="er" id="er"></div>`;
A.addS=()=>{cla();modal(mt('Add student')+studentFields(null)+'<div class="act-r"><button class="btn g" data-a="cl">Cancel</button><button class="btn" data-a="subS">Add student</button></div>')};
A.subS=()=>{const v=readStudent();if(!v)return;S.students.push({id:newSid(),...v,archived:false});cl();changed();toast('Student added')};
A.es=id=>{const s=stu(id);if(!s)return;cla();modal(mt('Edit student',esc(s.name))+studentFields(s)+`<div class="act-r"><button class="btn g" data-a="stu:${id}">Cancel</button><button class="btn" data-a="ses:${id}">Save changes</button></div>`)};
A.ses=id=>{const s=stu(id),v=readStudent();if(!s||!v)return;Object.assign(s,v);cl();cla();changed();A.stu(id);toast('Student updated')};
A.stu=id=>{cla();const s=stu(id);if(!s)return;const L=invs(id),b=owed(id),P=L.flatMap(i=>i.pays.map(p=>({...p,no:i.no}))).sort((a,c)=>c.d.localeCompare(a.d)),t=sst(s);
  modal(mt(esc(s.name),esc(s.parent)+' · '+esc(s.phone))+`<div style="display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:18px"><div class="bk"><div class="sub">Monthly fee</div>${rs(s.fee)}</div><div class="bk"><div class="sub">Status</div>${bd(t)}</div><div class="bk"><div class="sub">Outstanding</div>${rs(b)}</div></div>${kv('Joined',fd(s.joined))}${s.notes?kv('Notes',esc(s.notes)):''}<h3 style="margin:20px 0 4px">Invoice history</h3>${L.map(i=>`<div class="lr" data-a="inv:${i.id}"><div style="flex:1">${esc(i.no)}<div class="sub">${esc(i.per)}</div></div><span>${rs(i.amt)}</span>${bd(stt(i))}</div>`).join('')||none}<h3 style="margin:20px 0 4px">Payment history</h3>${P.map(p=>`<div class="lr" style="cursor:default"><div style="flex:1">${rs(p.a)}<div class="sub">${esc(p.no)} · ${esc(p.m)}</div></div><span class="sub">${fd(p.d)}</span></div>`).join('')||none}<div class="act-r" style="margin-top:18px;flex-wrap:wrap"><button class="btn g" data-a="es:${id}">Edit</button>${s.archived?`<button class="btn g" data-a="unarchS:${id}">Unarchive</button>`:`<button class="btn" data-a="ci:${id}">Create invoice</button><button class="btn g" data-a="archS:${id}">Archive</button>`}<button class="btn g" data-a="delS:${id}" style="color:var(--rd)">${TRASH} Delete</button></div>`,1)};
A.smenu=id=>{const s=stu(id);if(!s)return;cla();modal(mt(esc(s.name),'Student actions')+`<div style="display:flex;flex-direction:column;gap:8px">${s.archived?'':`<button class="btn g" data-a="ci:${id}">Create invoice</button>`}<button class="btn g" data-a="stu:${id}">View details</button><button class="btn g" data-a="es:${id}">Edit</button>${s.archived?`<button class="btn g" data-a="unarchS:${id}">Unarchive</button>`:`<button class="btn g" data-a="archS:${id}">Archive</button>`}<button class="btn g" data-a="delS:${id}" style="color:var(--rd)">${TRASH} Delete student</button></div>`)};

A.unarchS=id=>{const s=stu(id);if(!s)return;s.archived=false;cla();changed();toast(s.name+' restored')};
A.delS=id=>{const s=stu(id);if(!s)return;const n=invs(id).length;cla();modal(mt('Delete '+esc(s.name),'This cannot be undone.')+(n?`<div class="sub" style="margin-bottom:14px">${esc(s.name)} has ${n} invoice${n>1?'s':''} and payment records, so they can’t be deleted. Archive them instead; their history stays stored.</div><div class="act-r"><button class="btn g" data-a="cl">Cancel</button><button class="btn" data-a="archS:${id}">Archive instead</button></div>`:`<div class="sub" style="margin-bottom:14px">This permanently removes ${esc(s.name)} from FeeFlow.</div><div class="act-r"><button class="btn g" data-a="cl">Cancel</button><button class="btn" style="background:var(--rd)" data-a="delC:${id}">${TRASH} Delete permanently</button></div>`))};

/* invoices */
A.ci=sid=>{cla();const L=active(),s=stu(sid)&&!stu(sid).archived?stu(sid):L[0];if(!s)return toast('Add an active student first.');

A.saveInv=x=>{const g=i=>$('#'+i).value,er=m=>$('#er').textContent=m,a=Math.round(+g('c3')*100)/100;
  if(!g('c2'))return er('Choose a billing month.');
  const per=monLbl(g('c2')+'-01');
  if(S.invoices.some(i=>i.sid===g('c1')&&i.per===per))return er('This student already has an invoice for '+per+'. Edit that one instead.');
  if(!(a>0))return er('Enter an amount above zero.');
  if(!g('c4')||!g('c5'))return er('Set the issue and due dates.');
  if(g('c5')<g('c4'))return er('Due date can’t be before the issue date.');
  S.invoices.push({id:'i'+Date.now().toString(36)+Math.random().toString(36).slice(2,6),no:nextNo(),sid:g('c1'),per,iss:g('c4'),due:g('c5'),amt:a,pays:[],draft:x==='1',notes:g('c6').trim()});
  if(cur==='Invoices'){ui.per=per;ui.f='All'}cla();changed();toast(x==='1'?'Draft saved':'Invoice created')};
A.inv=id=>{cla();const i=S.invoices.find(x=>x.id==id);if(!i)return;const s=stu(i.sid),t=stt(i);
  modal(mt(esc(i.no),bd(t))+kv('Student',esc(s.name))+kv('Guardian',esc(s.parent))+kv('Billing period',esc(i.per))+kv('Issue date',fd(i.iss))+kv('Due date',fd(i.due))+kv('Amount',rs(i.amt))+(i.notes?kv('Notes',esc(i.notes)):'')+kv('Amount paid',rs(paidA(i)))+kv('Remaining balance','<b style="font-weight:500">'+rs(bal(i))+'</b>')+
  `<h3 style="margin:20px 0 4px">Payments</h3>${i.pays.map((p,k)=>`<div class="lr" style="cursor:default"><div style="flex:1">${rs(p.a)}<div class="sub">${esc(p.m)}${p.n?' · '+esc(p.n):''}</div></div><span class="sub">${fd(p.d)}</span><button class="lk" data-a="vp:${id}|${k}" style="color:var(--rd)">Remove</button></div>`).join('')||'<div class="sub" style="padding:10px 0">No payments yet.</div>'}`+
  `<div class="act-r" style="margin-top:18px;flex-wrap:wrap"><button class="btn g" data-a="ei:${id}">Edit</button>${i.draft?`<button class="btn" data-a="iss:${id}">Issue invoice</button>`:bal(i)>0?(['Pending','Partially paid','Overdue'].includes(t)?`<button class="btn g" data-a="rem:${id}">Draft reminder</button>`:'')+`<button class="btn" data-a="rp:${id}">Record payment</button>`:''}</div>`,1)};
A.iss=id=>{const i=S.invoices.find(x=>x.id==id);i.draft=false;changed();A.inv(id);toast('Invoice issued')};
A.ei=id=>{const i=S.invoices.find(x=>x.id==id);if(!i)return;cla();
  modal(mt('Edit invoice',esc(i.no)+' · '+esc(stu(i.sid).name))+fld('Amount (₹)','e1','number',i.amt,'min="1"')+`<div class="f2">${fld('Issue date','e2','date',i.iss)}${fld('Due date','e3','date',i.due)}</div><label class="f">Notes (optional)<textarea class="in" id="e4">${esc(i.notes||'')}</textarea></label><div class="sub" style="margin-bottom:8px">Paid so far: ${rs(paidA(i))}. The amount can’t go below this.</div><div class="er" id="er"></div><div class="act-r"><button class="btn g" data-a="inv:${id}">Cancel</button><button class="btn" data-a="sei:${id}">Save changes</button></div>`)};
A.sei=id=>{const i=S.invoices.find(x=>x.id==id),a=Math.round(+$('#e1').value*100)/100,er=m=>$('#er').textContent=m;
  if(!(a>0))return er('Enter an amount above zero.');
  if(a<paidA(i))return er('Amount can’t be below the '+rs(paidA(i))+' already paid.');
  if(!$('#e2').value||!$('#e3').value)return er('Set the issue and due dates.');
  if($('#e3').value<$('#e2').value)return er('Due date can’t be before the issue date.');
  Object.assign(i,{amt:a,iss:$('#e2').value,due:$('#e3').value,notes:$('#e4').value.trim()});cla();changed();toast('Invoice updated');A.inv(id)};
A.vp=x=>{const[id,k]=x.split('|'),i=S.invoices.find(v=>v.id==id);if(!i||!i.pays[+k])return;
  if(!confirm('Remove this payment of '+rs(i.pays[+k].a)+'? Use this only for a mistaken entry.'))return;
  i.pays.splice(+k,1);changed();A.inv(id);toast('Payment removed')};
A.rp=id=>{const i=S.invoices.find(x=>x.id==id);cla();modal(mt('Record payment',esc(i.no)+' · balance '+rs(bal(i)))+fld('Amount (₹)','p1','number',bal(i),'min="1"')+`<div class="f2">${fld('Payment date','p2','date',T0,'max="'+T0+'"')}<label class="f">Method<select class="in" id="p3"><option>UPI</option><option>Cash</option><option>Bank transfer</option></select></label></div><label class="f">Notes (optional)<textarea class="in" id="p4"></textarea></label><div class="er" id="er"></div><div class="act-r"><button class="btn g" data-a="cl">Cancel</button><button class="btn" data-a="sp:${id}">Record payment</button></div>`)};
A.sp=id=>{const i=S.invoices.find(x=>x.id==id),a=Math.round(+$('#p1').value*100)/100,er=m=>$('#er').textContent=m;
  if(!(a>0)||a>bal(i)+1e-9)return er('Enter an amount between ₹1 and '+rs(bal(i))+'.');
  const d=$('#p2').value;if(!d)return er('Pick a payment date.');
  if(d>T0)return er('Payment date can’t be in the future.');
  i.pays.push({a,d,m:$('#p3').value,n:$('#p4').value.trim()});cla();changed();toast(bal(i)>0?'Partial payment recorded':'Payment recorded');A.inv(id)};
A.rem=id=>{const i=S.invoices.find(x=>x.id==id),s=stu(i.sid),msg=`Hello ${s.parent}! A friendly reminder that ${s.name}’s tuition fee for ${i.per} is pending. The outstanding amount is ${rs(bal(i))}. Kindly make the payment when convenient. Thank you!`;
  cla();modal(mt('Payment reminder',s.phone?'Edit if you like, then copy or send.':'Edit if you like, then copy.')+`<textarea class="in" id="rm" style="height:140px;margin-bottom:6px">${esc(msg)}</textarea>`+(s.phone?'':'<div class="sub" style="margin-bottom:8px">Add the parent’s phone number on the student’s page to send on WhatsApp.</div>')+`<div class="act-r"><button class="btn g" data-a="cl">Close</button><button class="btn g" data-a="cp">Copy message</button>${s.phone?`<a id="wa" class="btn" target="_blank" rel="noopener" data-phone="${esc(s.phone)}" href="${waHref(s.phone,msg)}">Open in WhatsApp</a>`:''}</div>`)};
A.cp=async()=>{const t=$('#rm').value;try{await navigator.clipboard.writeText(t)}catch(_){const h=document.createElement('textarea');h.value=t;h.setAttribute('readonly','');h.style.position='fixed';h.style.opacity='0';document.body.appendChild(h);h.select();try{document.execCommand('copy')}catch(e){}h.remove()}toast('Reminder copied');const b=$('[data-a=cp]');if(b){b.textContent='Copied ✓';setTimeout(()=>b.textContent='Copy message',1800)}};

/* expenses */
A.aex=id=>{const e=S.expenses.find(x=>x.id==id)||null,o=(a,v)=>a.map(x=>`<option${x===v?' selected':''}>${esc(x)}</option>`).join(''),cats=[...new Set(['Housing','Utilities','Supplies','Travel','Other',...(e?[e.cat]:[])])];
  cla();modal(mt(e?'Edit expense':'Add expense',e?'':'Rent, a bill, or anything you pay yourself.')+fld('Expense name','x1','text',e?e.name:'','maxlength="60"')+`<div class="f2">${fld('Amount (₹)','x2','number',e?e.amt:'','min="1"')}${fld('Due date','x3','date',e?e.due:add(T0,7))}</div><div class="f2"><label class="f">Frequency<select class="in" id="x4">${o(['Monthly','One-time'],e&&e.fr)}</select></label><label class="f">Category<select class="in" id="x5">${o(cats,e&&e.cat)}</select></label></div><div class="er" id="er"></div><div class="act-r"><button class="btn g" data-a="cl">Cancel</button><button class="btn" data-a="sex:${e?e.id:''}">${e?'Save changes':'Add expense'}</button></div>`)};
A.sex=id=>{const g=i=>$('#'+i).value.trim(),a=+g('x2'),er=m=>$('#er').textContent=m;
  if(!g('x1'))return er('Give the expense a name.');
  if(!(a>0))return er('Enter an amount above zero.');
  if(!g('x3'))return er('Pick a due date.');

  cl();changed();toast(e?'Expense updated':'Expense added')};
A.dex=id=>{const e=S.expenses.find(x=>x.id==id);if(!e)return;cla();modal(mt('Delete '+esc(e.name),'This removes it from your forecast and notifications.')+`<div class="sub" style="margin-bottom:14px">${esc(e.name)} · ${rs(e.amt)} · ${esc(e.fr)}. This can’t be undone.</div><div class="act-r"><button class="btn g" data-a="cl">Cancel</button><button class="btn" style="background:var(--rd)" data-a="dexc:${id}">${TRASH} Delete expense</button></div>`)};
A.dexc=id=>{S.expenses=S.expenses.filter(x=>x.id!==id);cla();changed();toast('Expense deleted')};

/* WhatsApp: opens a chat with the message filled in. Indian numbers get the 91 country code. */
function waHref(phone,text){let d=String(phone).replace(/\D/g,'');if(d.length===10)d='91'+d;return'https://wa.me/'+d+'?text='+encodeURIComponent(text)}
/* one-click monthly invoices: every active student without this month's invoice, issued today, due in 10 days */
A.genMonth=()=>{const per=monLbl(T0),iss=T0,due=add(T0,10);
  const L=active().filter(s=>!S.invoices.some(i=>i.sid===s.id&&i.per===per));
  if(!L.length)return toast('Every active student already has an invoice for '+per);
  const total=sum(L,s=>s.fee);
  if(!confirm(`Create ${pls(L.length,'invoice')} for ${per}, totalling ${rs(total)}? Students who already have one are skipped.`))return;
  L.forEach(s=>S.invoices.push({id:'i'+s.id+Date.now().toString(36),no:nextNo(),sid:s.id,per,iss,due,amt:s.fee,pays:[],draft:false,notes:''}));
  ui.per=per;changed();go('Invoices');toast(pls(L.length,'invoice')+' created')};
/* bad-day view: one row per late customer, most overdue first, one action each */
function chaseList(){const seen=new Map();rcv().filter(i=>days(i)>0).forEach(i=>{const g=seen.get(i.sid);if(g){g.amt+=bal(i);g.n++}else seen.set(i.sid,{i,amt:bal(i),n:1})});return[...seen.values()]}
function chaseCard(){const L=chaseList();if(!L.length)return'';const tot=sum(L,x=>x.amt);
  return`<div class="card" style="margin-bottom:20px"><h3>Chase list</h3><div class="sub" style="margin-bottom:8px">${pls(L.length,'customer')} late, ${rs(tot)} in total. Work down the list, one action each.</div>${L.map(x=>{const s=stu(x.i.sid);return`<div class="lr" style="cursor:default"><span class="av">${esc(ini(s.name))}</span><div style="flex:1;min-width:140px"><div>${esc(s.name)}</div><div class="sub">${pls(days(x.i),'day')} late${x.n>1?' · '+x.n+' invoices':''}</div></div><span class="c">${rs(x.amt)}</span><div class="acts"><button class="btn sm" data-a="rem:${x.i.id}">Send reminder</button></div></div>`}).join('')}</div>`}

/* settings */
A.saveSet=()=>{const b=$('#st1').value.trim(),raw=$('#st2').value,o=+raw;if(raw===''||!Number.isFinite(o)){$('#er').textContent='Enter a valid opening balance.';return}S.settings={opening:o,business:b};changed();applyBusinessName();toast('Settings saved')};
A.exp=()=>{const blob=new Blob([JSON.stringify(S,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='feeflow-backup-'+T0+'.json';document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(url);a.remove()},1000);toast('Backup downloaded')};
A.sample=()=>{if(S.students.length&&!confirm('Replace your current data with sample data?'))return;S=normalize(sampleData());notice='';changed();toast('Sample data loaded')};
A.wipe=()=>{if(!confirm('Delete ALL FeeFlow data in this browser? Export a backup first if you need it.'))return;S=normalize({});notice='';changed();toast('All data cleared')};
document.addEventListener('change',e=>{const t=e.target;
  if(t.id==='imp'){const f=t.files[0];t.value='';if(!f)return;const r=new FileReader();
    r.onload=()=>{let p=null;try{p=JSON.parse(r.result)}catch(_){}
      if(!obj(p)||!Array.isArray(p.students)||!Array.isArray(p.invoices)){toast('That file is not a FeeFlow backup');return}
      if(!confirm('Replace all current data with this backup?'))return;S=normalize(p);notice='';changed();toast('Backup restored')};
    r.readAsText(f);return}
  if(t.dataset.c==='stu'){const s=stu(t.value);if(s)$('#c3').value=s.fee}
  if(t.dataset.c==='per'){ui.per=t.value;rr()}
});

/* ===== notifications: generated from data, read/dismissed state kept in S.notifications ===== */
const BADGE='position:absolute;top:-5px;right:-5px;width:auto;height:16px;min-width:16px;padding:0 4px;margin:0;border-radius:999px;font-size:10px;line-height:16px;text-align:center;color:#fff;background:var(--or);border:1.5px solid #fff';
const STATE=/^(overdue|exp|lowcash):/;
function syncNotifications(){
  /* Only things that need a decision: late fees (one per student), bills due or overdue within 2 days, and a cash shortfall. */
  const NL=S.notifications,have=new Map(NL.map(n=>[n.key,n])),live=new Set();
  const push=(key,title,sub,ref)=>{live.add(key);const o=have.get(key);if(o){o.title=title;o.sub=sub;o.ref=ref;return}const n={key,title,sub,ref,read:false,dismissed:false,at:Date.now()};have.set(key,n);NL.push(n)};
  chaseList().forEach(x=>{const s=stu(x.i.sid);push('overdue:'+s.id,`${s.name.split(' ')[0]} is ${pls(days(x.i),'day')} late`,`${rs(x.amt)} to collect. Tap to send a friendly reminder.`,{t:'rem',id:x.i.id})});
  billList(2,60).filter(b=>!b.paid&&b.g<=2).forEach(b=>push('exp:'+b.e.id+':'+b.key,`${b.e.name} ${b.g<0?'was due '+pls(-b.g,'day')+' ago':b.g===0?'is due today':'is due in '+pls(b.g,'day')}`,`${rs(b.e.amt)}. Open Cashflow to mark it paid once settled.`,{t:'cf'}));
  const f=fc(30),mn=Math.min(...f.bal);
  if(mn<0)push('lowcash:'+T0.slice(0,7),'Cash may run short soon',`Lowest projected balance is ${rs(mn)} on ${fd(add(T0,f.bal.indexOf(mn)))}. Check the forecast.`,{t:'cf'});
  /* drop anything whose condition no longer holds, including old-style payment and invoice entries */
  S.notifications=NL.filter(n=>STATE.test(n.key)&&live.has(n.key));
  S.notifSeeded=true;sv()}
function renderPop(){
  const all=(S.notifications||[]).filter(n=>!n.dismissed).reverse(),unread=all.filter(n=>!n.read).length,b=$('#bbtn .dot');

$('#pop').addEventListener('click',e=>{const t=e.target.closest('[data-nf]');if(!t)return;e.stopPropagation();const v=t.dataset.nf,p=v.indexOf(':'),c=p<0?v:v.slice(0,p),k=p<0?'':v.slice(p+1),N=S.notifications||[],n=N.find(x=>x.key===k);

function ddEnh(sel){if(sel.dataset.dd)return;sel.dataset.dd='1';const w=document.createElement('span');w.className='dd';w.style.cssText=sel.style.cssText;sel.style.cssText='';sel.classList.add('dd-n');

  b.innerHTML='<span></span>'+'<svg class="i" viewBox="0 0 24 24"><path d="m6 9 6 6 6-6"/></svg>';b.firstChild.textContent=sel.options[sel.selectedIndex]?sel.options[sel.selectedIndex].textContent:'';
  b.onclick=()=>{DD&&DD.b===b?ddClose():ddOpen(sel,b)};w.appendChild(b);sel.before(w)}
const ddAll=()=>{$$('select:not([data-dd])').forEach(ddEnh);if(DD&&!document.contains(DD.b))ddClose()};
new MutationObserver(ddAll).observe(document.body,{childList:true,subtree:true});ddAll();
document.addEventListener('pointerdown',e=>{if(DD&&!DD.l.contains(e.target)&&!DD.b.contains(e.target))ddClose()},true);
addEventListener('scroll',e=>{if(!DD||DD.l.contains(e.target))return;const r=DD.b.getBoundingClientRect();if(Math.abs(r.top-DD.y)>1||Math.abs(r.left-DD.x)>1)ddClose()},true);addEventListener('resize',ddClose);
document.addEventListener('keydown',e=>{if(!DD){if(e.target.classList&&e.target.classList.contains('dd-b')&&(e.key==='ArrowDown'||e.key==='ArrowUp')){e.preventDefault();e.target.click()}return}
